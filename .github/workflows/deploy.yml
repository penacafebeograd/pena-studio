name: Deploy penastudio.cc

# Builds the Pena Tools app and publishes the whole site to GitHub Pages:
#   /            -> existing Pena Studio landing page (index.html)
#   /work.html   -> existing work page
#   /privacy.html -> privacy policy (SR/EN/TR)
#   /assets/     -> images, icons and the share preview for those two pages
#   /tools/      -> Pena Tools (built from tools-src/)
#   /tools/link  -> personalised demo link builder (not linked, noindex)
#
# Only the staged _site directory is published, so neither the app source nor
# node_modules ever reaches the public site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools-src/package-lock.json

      - name: Install
        working-directory: tools-src
        run: npm ci

      - name: Typecheck and build Pena Tools
        working-directory: tools-src
        env:
          VITE_FORM_ENDPOINT: ${{ secrets.VITE_FORM_ENDPOINT }}
          VITE_FORM_ACCESS_KEY: ${{ secrets.VITE_FORM_ACCESS_KEY }}
          VITE_CF_BEACON_TOKEN: ${{ secrets.VITE_CF_BEACON_TOKEN }}
        run: npm run build

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html work.html privacy.html robots.txt sitemap.xml llms.txt CNAME .nojekyll _site/
          cp -r assets _site/assets
          cp -r tools _site/tools

      - name: Fill in the homepage form endpoint
        env:
          VITE_FORM_ENDPOINT: ${{ secrets.VITE_FORM_ENDPOINT }}
          VITE_FORM_ACCESS_KEY: ${{ secrets.VITE_FORM_ACCESS_KEY }}
        run: node .github/scripts/inject-form-config.mjs _site/index.html

      - name: Verify nothing is missing before publishing
        run: |
          for f in _site/index.html _site/work.html _site/privacy.html _site/CNAME \
                   _site/robots.txt _site/sitemap.xml _site/llms.txt \
                   _site/assets/og-image.jpg _site/assets/hero-sparks.jpg \
                   _site/tools/index.html \
                   _site/tools/demo/salon/index.html \
                   _site/tools/demo/gym/index.html \
                   _site/tools/link/index.html; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          # /tools/ ships pre-rendered so crawlers that skip JavaScript see the
          # copy; an empty root means the prerender step silently did nothing.
          grep -q 'FAQPage' _site/tools/index.html \
            || { echo "tools/index.html was not prerendered"; exit 1; }
          ! grep -q '<div id="root"></div>' _site/tools/index.html \
            || { echo "tools/index.html has an empty root"; exit 1; }
          test ! -d _site/tools-src || { echo "source leaked into the artifact"; exit 1; }
          test ! -d _site/node_modules || { echo "node_modules leaked into the artifact"; exit 1; }
          echo "Staged site:"; find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
